spring:
  #  profiles:
  #    active: mongo, mysql

  datasource:
    url=jdbc:h2:mem:testdb;MODE=MySQL:
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        globally_quoted_identifiers: true
server:
  error:
    include-binding-errors: always
    include-message: always