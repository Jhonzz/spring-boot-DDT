spring:
  #  profiles:
  #    active: mongo, mysql
  application:
    name: anime-service
  threads:
    virtual:
      enabled: true

logging:
  level:
    academy.devdojo: debug

server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-stacktrace: ON_PARAM #?trace=true
  tomcat:
    threads:
      max: 20

database:
  url: ${DB_URL:localhost}:${DB_PORT:3306}
  username: ${LOCAL_USERNAME:JHON} #if the enviroment variable doesnt exist will set JHON as value
  password: ${LOCAL_PASSWORD:devdojo}